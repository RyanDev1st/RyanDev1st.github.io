<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Same tokens as the portfolio, so the card in the visitor's hand and the site read as one thing. */
  :root{
    --bg:#0b0c0e; --surface:#131417; --surface-2:#181a1f; --fg:#d9dad4; --text:#b8bab3;
    --muted:#73767f; --border:#282b31; --signal:#ff2a12;
    --disp:'Space Grotesk',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg);-webkit-text-size-adjust:100%}
  body{min-height:100svh;background:
      radial-gradient(120% 60% at 50% 0%, rgba(217,218,212,.06), transparent 60%), var(--bg);
    color:var(--fg);font-family:var(--disp);-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    display:flex;justify-content:center;
    padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:1px solid var(--signal);outline-offset:4px}
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:28px}

  .id{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:12px}
  .ava{width:112px;height:112px;border-radius:50%;overflow:hidden;border:1px solid var(--border);
    background:var(--surface);box-shadow:0 0 0 6px rgba(217,218,212,.03)}
  .ava img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;transform:scale(1.35);transform-origin:50% 22%}
  .name{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:.9;display:flex;align-items:flex-end;gap:.06em}
  .name i{display:inline-block;width:.16em;height:.5em;background:var(--signal);margin-bottom:.08em;animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .role{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .status{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--fg);border:1px solid var(--border);border-radius:999px;padding:7px 12px}
  .status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--signal);box-shadow:0 0 8px var(--signal)}

  .links{list-style:none;display:flex;flex-direction:column;gap:10px}
  .ln{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;min-height:64px;
    padding:12px 16px 12px 12px;border:1px solid var(--border);border-radius:14px;background:var(--surface);
    transition:border-color .2s ease,background .2s ease,transform .2s ease}
  .ln:hover{border-color:#3a3e46;background:var(--surface-2)}
  .ln:active{transform:scale(.985)}
  .ln--main{border-color:rgba(255,42,18,.45)}
  .ln--main:hover{border-color:var(--signal)}
  .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--border)}
  .ic svg{width:18px;height:18px;fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .ic svg.f{fill:var(--fg);stroke:none}
  .t{display:flex;flex-direction:column;gap:3px;min-width:0}
  .t b{font-weight:500;font-size:16px;letter-spacing:-.01em}
  .t span{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .go{font-family:var(--mono);font-size:14px;color:var(--muted);transition:transform .2s ease,color .2s ease}
  .ln:hover .go{transform:translateX(3px);color:var(--fg)}

  .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .act{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1px dashed var(--border);border-radius:12px;
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text);transition:border-color .2s,color .2s}
  .act:hover{border-color:var(--muted);color:var(--fg)}
  .act svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .foot{text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:var(--fg);color:var(--bg);
    padding:10px 14px;border-radius:999px;transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* Entrance: one short stagger, transform + opacity only. */
  .in{opacity:0;transform:translateY(8px);animation:rise .5s cubic-bezier(.22,.7,.2,1) forwards;animation-delay:calc(var(--i,0) * 60ms)}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}.name i{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <header class="id">

    <p class="role in" style="--i:2">AI Engineer · Designer · Systems Architect</p>
    <p class="status in" style="--i:3">Open to work</p>
  </header>

  <!-- To add a profile (Facebook, Instagram, X, ...): copy one <li>, change href, label, handle and icon. -->
  <ul class="links">
    <li class="in" style="--i:4"><a class="ln ln--main" href="https://ryandev1st.github.io/portfolio/">
      <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg></span>
      <span class="t"><b>Portfolio</b><span>work, path, contact</span></span><span class="go" aria-hidden="true">&rarr;</span></a></li>
    <li class="in" style="--i:5"><a class="ln" href="https://github.com/RyanDev1st" rel="noopener">
      <span class="ic"><svg class="f" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.46-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.3 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg></span>
      <span class="t"><b>GitHub</b><span>@RyanDev1st</span></span><span class="go" aria-hidden="true">&rarr;</span></a></li>
    <li class="in" style="--i:6"><a class="ln" href="https://www.linkedin.com/in/ryandev1st/" rel="noopener">
      <span class="ic"><svg class="f" viewBox="0 0 24 24"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11H3zm7 0h3.8v1.5h.06c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.77 2.65 4.77 6.1v5.45h-4v-4.83c0-1.15-.02-2.63-1.6-2.63-1.6 0-1.85 1.25-1.85 2.55v4.91h-4z"/></svg></span>
      <span class="t"><b>LinkedIn</b><span>in/ryandev1st</span></span><span class="go" aria-hidden="true">&rarr;</span></a></li>
    <li class="in" style="--i:7"><a class="ln" href="https://www.facebook.com/ryancpp/" rel="noopener">
      <span class="ic"><svg class="f" viewBox="0 0 24 24"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.87.25-1.46 1.5-1.46h1.6V4.46A21 21 0 0 0 14.27 4.3c-2.3 0-3.87 1.4-3.87 3.98v2.22H7.8v3h2.6V21z"/></svg></span>
      <span class="t"><b>Facebook</b><span>ryancpp</span></span><span class="go" aria-hidden="true">&rarr;</span></a></li>
    <li class="in" style="--i:8"><a class="ln" href="https://zalo.me/84908619328" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.55L3 20.5l1.5-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg></span>
      <span class="t"><b>Zalo / Phone</b><span>+84 908 619 328</span></span><span class="go" aria-hidden="true">&rarr;</span></a></li>
    <!-- Discord has no public link by username, so this row copies the handle (falls back to the profile search page without JS). -->
    <li class="in" style="--i:9"><a class="ln" id="discord" href="https://discord.com/app" rel="noopener" data-handle="ryandev1st">
      <span class="ic"><svg class="f" viewBox="0 0 24 24"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.028C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.1 14.1 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg></span>
      <span class="t"><b>Discord</b><span>ryandev1st &middot; tap to copy</span></span><span class="go" aria-hidden="true">&rarr;</span></a></li>
    <li class="in" style="--i:10"><a class="ln" href="mailto:ryandev1st@gmail.com">
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></span>
      <span class="t"><b>Email</b><span>ryandev1st@gmail.com</span></span><span class="go" aria-hidden="true">&rarr;</span></a></li>

  <div class="acts in" style="--i:11">
    <button class="act" id="save" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.2-6 8-6s6.8 2 8 6"/></svg>Save contact</button>
    <button class="act" id="share" type="button"><svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Share</button>
  </div>
  <p class="foot in" style="--i:12">ryandev1st.github.io/tree</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  (function(){
    var toast=document.getElementById('toast'), tT;
    function say(t){ toast.textContent=t; toast.classList.add('on'); clearTimeout(tT); tT=setTimeout(function(){ toast.classList.remove('on'); },1800); }
    // A vCard straight from the page: someone holding the paper resume adds Ryan to their phone in one tap.
    document.getElementById('save').addEventListener('click',function(){
      var v=['BEGIN:VCARD','VERSION:3.0','N:;Ryan;;;','FN:Ryan','TITLE:AI Engineer, Designer, Systems Architect',
        'TEL;TYPE=CELL:+84908619328','EMAIL;TYPE=INTERNET:ryandev1st@gmail.com','URL:https://ryandev1st.github.io/portfolio/',
        'URL:https://github.com/RyanDev1st','URL:https://www.linkedin.com/in/ryandev1st/','URL:https://www.facebook.com/ryancpp/',
        'NOTE:Discord: ryandev1st','END:VCARD'].join('\r\n');
      var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([v],{type:'text/vcard'})); a.download='ryan.vcf';
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    });
    document.getElementById('discord').addEventListener('click',function(e){
      var h=this.getAttribute('data-handle');
      if(!navigator.clipboard) return;
      e.preventDefault();
      navigator.clipboard.writeText(h).then(function(){ say('Discord handle copied'); },function(){ say(h); });
    });
    document.getElementById('share').addEventListener('click',function(){
      var url=location.href.split('#')[0];
      if(navigator.share){ navigator.share({title:'Ryan',url:url}).catch(function(){}); return; }
      if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){ say('Link copied'); },function(){ say(url); }); }
      else say(url);
    });
  })();
</script>
